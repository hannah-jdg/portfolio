<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Contact</title>
  <link rel="icon" type="image/png" href="images/icon2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="container">
        <div class="site-header-inner">
          <a class="site-logo" href="index.html">
            <span class="site-logo-text">
              <span class="site-logo-primary">Hannah</span>
              <span class="site-logo-secondary">Gagnon</span>
            </span>
          </a>
          <div id="site-nav-panel" class="site-nav-panel">
            <nav class="site-nav" aria-label="Main navigation">
              <a class="nav-link" href="about.html">About</a>
              <a class="nav-link" href="misc.html">Misc.</a>
            </nav>
            <a class="nav-link site-nav-contact nav-link--external" href="contact.html">Contact<span class="nav-external-mark" aria-hidden="true">&#8599;</span></a>
            <div class="nav-overlay-icons" aria-hidden="true">
              <img src="images/icon1.png" alt="">
              <img src="images/icon2.png" alt="">
              <img src="images/icon3.png" alt="">
            </div>
          </div>
          <button type="button" class="nav-overlay-close nav-overlay-close--in-panel" aria-label="Close menu">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
          </button>
          <div class="nav-toggle-wrap">
            <button type="button" class="nav-overlay-close" aria-label="Close menu">
              <span class="nav-toggle-bar"></span>
              <span class="nav-toggle-bar"></span>
              <span class="nav-toggle-bar"></span>
            </button>
            <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav-panel">
              <span class="nav-toggle-bar"></span>
              <span class="nav-toggle-bar"></span>
              <span class="nav-toggle-bar"></span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="site-main">
      <div class="container">
        <section class="contact-hero">
          <h1 class="contact-heading">Get in touch here!</h1>
        </section>

        <section class="contact-layout">
          <div class="contact-left">
            <div class="contact-social">
              <a class="contact-social-link" href="https://www.linkedin.com/in/hannah-gagnon" target="_blank" rel="noreferrer">
                <span>LinkedIn</span>
                <span aria-hidden="true">↗</span>
              </a>
              <a class="contact-social-link" href="https://www.instagram.com/hannahdsgns/" target="_blank" rel="noreferrer">
                <span>Instagram</span>
                <span aria-hidden="true">↗</span>
              </a>
            </div>

            <h2 class="contact-subheading">Send me a message below:</h2>

            <form class="contact-form" action="https://formspree.io/f/mvzbdwbj" method="POST">
              <label class="contact-label">
                Name:
                <input type="text" name="name" placeholder="Full Name">
              </label>

              <label class="contact-label">
                Email:
                <input type="email" name="email" placeholder="email@mail.com">
              </label>

              <label class="contact-label">
                Message:
                <textarea name="message" placeholder="Message here..."></textarea>
              </label>

              <button class="contact-submit" type="submit">Submit</button>
            </form>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <section class="footer-content">
          <div class="footer-top">
            <div class="footer-intro">
              <p class="footer-headline">Thanks for checking out my little corner of the internet.</p>
            </div>
            <div class="footer-links">
              <a href="https://www.linkedin.com/in/hannah-gagnon" target="_blank" rel="noreferrer">LinkedIn</a>
              <span aria-hidden="true">·</span>
              <a href="https://www.instagram.com/hannahdsgns/" target="_blank" rel="noreferrer">Instagram</a>
              <span aria-hidden="true">·</span>
              <a href="https://drive.google.com/file/d/1KCK21QsOTNV0Spug_Ry0gA2059eIi4YT/view?usp=sharing" target="_blank" rel="noreferrer">Resume</a>
            </div>
          </div>
          <div class="footer-bottom">
            <p class="footer-meta">2026 &copy; Hannah Gagnon</p>
            <p class="footer-meta">MADE WITH <span class="text-symbol" aria-hidden="true">&#x2665;&#xFE0E;</span> BY HANNAH</p>
          </div>
        </section>
      </div>
    </footer>
  </div>
</body>
</html>
